[project]
name = "basacore-api"
version = "0.1.0"
description = "Basacore — centralized application, tenant and company operating platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "email-validator==2.3.0",
  "sqlalchemy[asyncio]==2.1.6",
  "asyncpg==0.32.0",
  "alembic==1.20.1",
  "greenlet==3.5.6",
  "argon2-cffi==25.1.0",
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
  "pyotp==2.10.0",
  "redis==8.1.0",
  "structlog==26.1.0",
  "python-multipart==0.0.33",
  "dnspython==2.9.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "httpx==0.28.1",
  "ruff==0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
  "S101",   # asserts are used in tests
  "B008",   # FastAPI dependency injection calls are defaults by design
  "S105",   # "Bearer" / documented local seed password are not real secrets
  "S106",   # same as S105 (FastAPI token_type argument)
  "S608",   # the only interpolated SQL fragments are fixed server-side clause lists
  "UP042",  # keep explicit (str, Enum) for SQLAlchemy/Pydantic compatibility
  "UP046",  # keep Generic[T] form for Pydantic v2 typing support
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/seed.py" = ["S105", "S106", "S311", "S324"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
