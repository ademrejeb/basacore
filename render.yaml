###############################################################################
# Render Blueprint — Basacore API.
#   https://dashboard.render.com/blueprint/new?repo=https://github.com/ademrejeb/basacore
#
# Values marked `sync: false` are prompted for in the dashboard.
# DATABASE_URL format: postgresql+asyncpg://USER:PASS@HOST/DB?ssl=require
# The production config guard refuses to boot without every key below.
###############################################################################

services:
  - type: web
    name: basacore-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: SEED_REFERENCE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: SHOW_DEMO_CREDENTIALS
        value: "true"
      - key: JWT_AUDIENCE
        value: basacore
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: API_BASE_URL
        value: https://basacore-api.onrender.com
      - key: WEB_BASE_URL
        value: https://basacore-console.onrender.com
      - key: JWT_ISSUER
        value: https://basacore-api.onrender.com
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: CORS_ORIGINS
        value: https://basacore-console.onrender.com,https://fieldopsfieldops.onrender.com,https://factory-web-scfz.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://basacore-console.onrender.com,https://fieldopsfieldops.onrender.com,https://factory-web-scfz.onrender.com
      - key: SEED_ADMIN_EMAIL
        value: admin@basa.dev
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Used by `python -m app.seed --accounts` (schema + OIDC client).
      - key: SUITE_PUBLIC_ORIGINS
        value: https://fieldopsfieldops.onrender.com,https://factory-web-scfz.onrender.com
      - key: SUITE_OIDC_SECRET
        sync: false
